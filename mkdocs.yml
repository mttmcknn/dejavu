site_name: Dejavu
site_description: Lock in Compose UI efficiency. Catch recomposition regressions before your users.
site_url: https://dejavu.mmckenna.me
repo_url: https://github.com/mttmcknn/dejavu
repo_name: mttmcknn/dejavu
edit_uri: edit/main/docs/
strict: true
hooks:
  - validation/docs_hook.py

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    logo: simple/ebox
  favicon: assets/favicon.svg
  font:
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - content.code.copy
    - content.action.edit

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guides:
      - Use Cases: use-cases.md
      - Examples: examples.md
      - How It Works: how-it-works.md
      - Error Messages: error-messages.md
      - Causality Analysis: causality-analysis.md
  - 'API Reference ↗': api/index.html
  - Releases:
      - Versions and migration: releases/index.md
      - 0.5.0 validation: releases/0.5.0.md
      - 0.4.0 validation: releases/0.4.0.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - toc:
      permalink: true
  - attr_list

plugins:
  - search
  - mike

extra:
  dejavu_release: 0.5.0
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mttmcknn/dejavu
